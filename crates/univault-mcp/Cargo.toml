[package]
name = "univault-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only MCP server exposing Titan Quest game data (characters, vaults, banks, skills) over stdio"

[dependencies]
univault-core = { path = "../univault-core" }
rmcp = { version = "3.1.4", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"

[lints]
workspace = true
